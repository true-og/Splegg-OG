  VotingReminder: 30
  # Days a stored pre-game return location survives restarts. 0 keeps them forever.
  PreJoinLocationExpiryDays: 30
# Splegg only manages dedicated lobby and in-game worlds. The vanilla overworld
# (world, world_nether, world_the_end) is hard-blacklisted in code and cannot
# be added here -- splegg will refuse to put a map, inventory group, or any
# listener side effect into those worlds even if their names appear below.
# Worlds listed here are loaded by Splegg itself on the first tick after startup;
# create them with MyWorlds first (e.g. /mw create splegg_lobby void) or place
# them under MapBase. Folder names match case-insensitively and ignoring - and _.
#
# MapBase (optional): cold-storage directory holding world templates. Each
# Worlds.Lobby and Worlds.InGame name is resolved to <MapBase>/<Name>/ on
# startup; the world is copied to the server root and (re-)loaded from that fresh
# copy on every boot. Spawns/floors/match-lobby coords stored in
# plugins/Splegg-OG/<map>.yml carry over across reboots. In-game terrain edits to
# a template world are wiped on the next restart -- to make terrain changes stick,
# replace the files under <MapBase>/<Name>/ externally. Leave empty to keep the
# legacy behavior, where worlds live directly at the server root.
# Relative paths resolve against the server's world container (server root on
# a default install). Absolute paths are accepted.
#
# VoidGenerator: pin the bundled void chunk generator onto every world Splegg
# loads or copies. A copied world folder carries no MyWorlds generator setting,
# so without this chunks outside the built arena generate vanilla terrain.
#
# GamePrefix: lobby ids and world names share it. Every world listed under
# Worlds.Lobby must be named <GamePrefix><number>-<name>, for example SP1-hub:
# that world is the hub of lobby SP1, which players join with /splegg join SP1 or
# /splegg join 1. Players wait and vote for the map in the hub; when the vote
# ends the winning template from Worlds.InGame is copied to
# <GamePrefix><number>-<map> (SP1-Shake_It) and the match runs there. Add a
# second hub (SP2-hub) for a second concurrent lobby.
# Chat-OG keys its per-game Discord channel off this prefix, so keep the two in sync.
Worlds:
  MapBase: 'maps'
  VoidGenerator: true
  GamePrefix: SP
  Lobby:
    - SP1-hub
  InGame:
    - Loss
# Join signs render like TheHerobrine-OG's: title, lobby or map, bold status,
# then black-on-sign player counts. A repeating task redraws every sign each
# second. Placeholders: %lobby% (SP1), %map% (the voted map, or the lobby id
# while the vote is open), %status%, %count%, %maxcount%.
Sings:
  Format:
    1: '&4Splegg'
    2: '&6%map%'
    3: '%status%'
    4: '&0%count%&8/&0%maxcount%'
  Status:
    Join: '&2&lJOIN'
    Starting: '&5&lSTARTING'
    Started: '&3&lLIVE'
    Full: '&4&lFULL'
    Ending: '&8&lENDING'
    Disabled: '&cDISABLED'
