name: Splegg-OG
main: main.SpleggOG
version: '${version}'
authors: [Hraponssi, MrLuangamer, Theluangamer9416, NotAlexNoyle]
api-version: '${apiVersion}'
depend: [DiamondBank-OG, WorldEdit, MyWorlds, Utilities-OG]
softdepend: [My_Worlds, Chat-OG, Scoreboard-OG]

# /vote and /v are not declared here on purpose: VoteCommandListener claims them inside Splegg
# territory only, so VotingPlugin keeps the labels everywhere else.
commands:
  splegg:
    description: The command prefix for all Splegg-OG commands.
    aliases: [sp]
  hub:
    description: Leave the Splegg lobby or game and return to the main world.
  spjoin:
    description: Join a Splegg lobby by its id.
    usage: /<command> [lobby]
  spforcestart:
    description: Start the Splegg game even if the player minimum is not met.
    permission: splegg.admin
    usage: /<command> [time]


permissions:
  splegg.use:
    description: Permission to run Splegg-OG commands.
    default: op
    children:
      splegg.join: true
  splegg.join:
    description: Permission to join Splegg games.
    default: op
  splegg.joinfull:
    description: Permission to join full Splegg games.
    default: op
  splegg.admin:
    description: Permission to manage Splegg maps, signs, and matches.
    default: op
    children:
      splegg.use: true
      splegg.join: true
      splegg.joinfull: true
